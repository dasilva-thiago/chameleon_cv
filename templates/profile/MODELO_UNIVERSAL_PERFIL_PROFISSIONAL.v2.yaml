# MODELO UNIVERSAL DE PERFIL PROFISSIONAL — versão 2.1.0
#
# Este arquivo é um FORMULÁRIO DE COLETA, não um currículo. Preencha apenas o que souber.
# Contrato: packages/contracts (Zod 4) → JSON Schema em packages/contracts/generated/.
# Importado sem alterações, este modelo gera ZERO registros.
#
# REGRAS
#  1. Ausência: omita o campo ou use null quando não souber. Lista vazia ([]) significa "nenhum
#     item informado", nunca "a pessoa não tem experiência". Texto vazio ("") NÃO é aceito: use null.
#  2. Datas: AAAA, AAAA-MM ou AAAA-MM-DD, conforme a precisão real. Não complete com dia ou mês
#     inventados. Em fim de período use "present" para "atual" (não existe campo is_current).
#     Em YAML, escreva SEMPRE entre aspas: "2020" (sem aspas, 2020 seria um número e é rejeitado).
#  3. Não invente números, clientes, cargos, tecnologias ou níveis de domínio.
#  4. Para dizer que um campo NÃO SE APLICA, que você NÃO QUER informar ou que precisa CONFIRMAR,
#     use meta.field_states (nos blocos: field_states): not_applicable | declined | not_assessed |
#     needs_confirmation. Não escreva "Não informado" como valor de texto. A chave pode ser um
#     caminho dentro do registro, ex.: business.portfolio_url ou metric.value.
#     Telefones: escreva como preferir, ex. (12) 91234-5678 ou +55 12 91234-5678; o importador
#     guarda só os dígitos (e o +). Idiomas: use overall_level (A1..C2, native) quando souber o nível
#     CEFR, ou self_described_level (texto livre, ex.: "avançado") com suas próprias palavras.
#  5. Coleções (contact_points, experiences, projects, ...): copie o exemplo comentado, preencha e
#     troque o "[]" pela lista. "id" é opcional e livre (ex.: EXP-001); use ids para ligar registros
#     (competências usadas em experiências, evidências, pendências). O sistema converte para UUID.
#  6. Tecnologias e competências: cadastre em skills[] e registre ONDE foram usadas em
#     skill_usages[] (usage_context + experiência/projeto/formação/curso/certificação/voluntariado).
#  7. Tudo o que for importado entra como needs_review; o status declarado fica em meta.declared_status.
#     Defaults de visibilidade e de uso em currículo são aplicados pelo importador, não por este arquivo.
#  8. Privados por construção (nunca vão a currículos nem à IA): availability_preferences,
#     career_preferences, usage_rules, identity.pronouns, experiences[].exit_reason, meta.private_notes.
#  9. Não inclua CPF/RG, endereço residencial completo, dados bancários, saúde, religião ou política.
# 10. O consentimento de processamento NÃO é registrado neste arquivo (é dado na aplicação).

