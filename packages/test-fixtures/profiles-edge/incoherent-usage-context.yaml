# Edge case sintetico (ADR-0007): professional_experience sem experience_id; project_experience apontando
# para experiencia; duas fontes no mesmo uso. REJEITADO (coerencia de contexto e no maximo uma fonte).
schema_version: '2.1.0'
profile:
  experiences:
    - { id: EXP-001, organization_name: Empresa Fictícia Eta, official_title: Analista }
  projects:
    - { id: PRJ-001, name: Projeto Fictício, category: personal }
  skills:
    - { id: SKL-001, name: Python }
  skill_usages:
    - { id: USE-001, skill_id: SKL-001, usage_context: professional_experience }
    - { id: USE-002, skill_id: SKL-001, usage_context: project_experience, experience_id: EXP-001 }
    - {
        id: USE-003,
        skill_id: SKL-001,
        usage_context: coursework,
        project_id: PRJ-001,
        experience_id: EXP-001,
      }
